<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insurance Lead Management System</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --bg2: #1a1d27; --bg3: #242736;
      --border: #2e3248; --text: #e2e4f0; --muted: #8b8fa8;
      --purple: #7c6ff7; --teal: #22d3aa; --coral: #f97066;
      --amber: #fbbf24; --green: #4ade80; --blue: #60a5fa;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; flex-shrink: 0; }
    .logo { padding: 0 20px 24px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .logo h1 { font-size: 14px; font-weight: 600; color: var(--purple); letter-spacing: 0.5px; }
    .logo p  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; font-size: 13px; color: var(--muted); border-left: 3px solid transparent; transition: all .15s; }
    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item.active { background: var(--bg3); color: var(--purple); border-left-color: var(--purple); }
    .nav-icon { font-size: 16px; width: 18px; text-align: center; }

    /* Main */
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .topbar h2 { font-size: 16px; font-weight: 600; }
    .content { padding: 24px 28px; flex: 1; }

    /* Cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .card-value { font-size: 28px; font-weight: 700; }
    .card-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* Table */
    .table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .table-header h3 { font-size: 14px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 500; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg3); }

    /* Badges */
    .badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 500; }
    .badge-NEW       { background: #1e2a3a; color: var(--blue); }
    .badge-CONTACTED { background: #251e3a; color: var(--purple); }
    .badge-QUALIFIED { background: #1a2e28; color: var(--teal); }
    .badge-CONVERTED { background: #1a2e1a; color: var(--green); }
    .badge-LOST      { background: #2e1a1a; color: var(--coral); }
    .badge-AUTO      { background: #1e2533; color: var(--blue); }
    .badge-HEALTH    { background: #1a2e28; color: var(--teal); }
    .badge-LIFE      { background: #251e3a; color: var(--purple); }
    .badge-HOME      { background: #2e2a1a; color: var(--amber); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: opacity .15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-ghost   { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-teal  { background: #0d3329; color: var(--teal); border: 1px solid #0f4438; }
    .btn-coral { background: #2e1a1a; color: var(--coral); border: 1px solid #3e2020; }

    /* Form */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 480px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-group label { font-size: 12px; color: var(--muted); }
    .form-group input, .form-group select { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 13px; outline: none; transition: border-color .15s; }
    .form-group input:focus, .form-group select:focus { border-color: var(--purple); }
    .form-group select option { background: var(--bg3); }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* Score bar */
    .score-bar-bg { background: var(--bg3); border-radius: 4px; height: 6px; width: 80px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
    .score-bar-fill { height: 100%; border-radius: 4px; }

    /* Misc */
    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }
    .loading { text-align: center; padding: 48px; color: var(--muted); }
    .error-banner { background: #2e1a1a; border: 1px solid #5a2020; border-radius: 8px; padding: 12px 16px; color: var(--coral); font-size: 13px; margin-bottom: 16px; }
    .success-banner { background: #1a2e1a; border: 1px solid #205a20; border-radius: 8px; padding: 12px 16px; color: var(--green); font-size: 13px; margin-bottom: 16px; }
    .tag { display: inline-block; padding: 2px 8px; background: var(--bg3); border-radius: 6px; font-size: 11px; color: var(--muted); }
    .flex-gap { display: flex; gap: 8px; flex-wrap: wrap; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API = 'http://localhost:8000';

async function apiFetch(path, options = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'Request failed');
  }
  if (res.status === 204) return null;
  return res.json();
}

// ── Score bar component ──────────────────────────────────────────────────
function ScoreBar({ score }) {
  const color = score >= 70 ? '#4ade80' : score >= 40 ? '#fbbf24' : '#f97066';
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
      <span className="score-bar-bg">
        <span className="score-bar-fill" style={{ width: `${score}%`, background: color }}/>
      </span>
      <span style={{ fontSize: 12, color }}>{score.toFixed(0)}</span>
    </span>
  );
}

// ── Create Lead Modal ────────────────────────────────────────────────────
function CreateLeadModal({ onClose, onCreated }) {
  const [form, setForm] = useState({
    lead_type: 'AUTO', first_name: '', last_name: '', email: '',
    phone: '', age: '', income: '', coverage_amount: '',
    lead_source: 'WEBSITE', prior_insurance: false,
  });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const submit = async () => {
    if (!form.first_name || !form.last_name || !form.email) {
      setError('First name, last name, and email are required.'); return;
    }
    setLoading(true); setError('');
    try {
      const lead = await apiFetch('/leads', {
        method: 'POST',
        body: JSON.stringify({ ...form, age: +form.age || 0, income: +form.income || 0, coverage_amount: +form.coverage_amount || 0 }),
      });
      onCreated(lead);
      onClose();
    } catch (e) { setError(e.message); }
    setLoading(false);
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h3>New Insurance Lead</h3>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-row">
          <div className="form-group">
            <label>First name *</label>
            <input value={form.first_name} onChange={e => set('first_name', e.target.value)} placeholder="Jane"/>
          </div>
          <div className="form-group">
            <label>Last name *</label>
            <input value={form.last_name} onChange={e => set('last_name', e.target.value)} placeholder="Doe"/>
          </div>
        </div>
        <div className="form-group">
          <label>Email *</label>
          <input value={form.email} onChange={e => set('email', e.target.value)} placeholder="jane@example.com"/>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label>Phone</label>
            <input value={form.phone} onChange={e => set('phone', e.target.value)} placeholder="07700 900 000"/>
          </div>
          <div className="form-group">
            <label>Age</label>
            <input type="number" value={form.age} onChange={e => set('age', e.target.value)} placeholder="35"/>
          </div>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label>Lead type</label>
            <select value={form.lead_type} onChange={e => set('lead_type', e.target.value)}>
              {['AUTO','HEALTH','LIFE','HOME'].map(t => <option key={t}>{t}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label>Lead source</label>
            <select value={form.lead_source} onChange={e => set('lead_source', e.target.value)}>
              {['WEBSITE','REFERRAL','AGENT','SOCIAL_MEDIA','COLD_CALL'].map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label>Annual income (£)</label>
            <input type="number" value={form.income} onChange={e => set('income', e.target.value)} placeholder="55000"/>
          </div>
          <div className="form-group">
            <label>Coverage amount (£)</label>
            <input type="number" value={form.coverage_amount} onChange={e => set('coverage_amount', e.target.value)} placeholder="100000"/>
          </div>
        </div>
        <div className="form-group">
          <label style={{ flexDirection: 'row', alignItems: 'center', gap: 10, display: 'flex', cursor: 'pointer' }}>
            <input type="checkbox" checked={form.prior_insurance} onChange={e => set('prior_insurance', e.target.checked)} style={{ width: 'auto' }}/>
            Has prior insurance
          </label>
        </div>
        <div className="form-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>
            {loading ? 'Creating...' : 'Create Lead'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Create Agent Modal ───────────────────────────────────────────────────
function CreateAgentModal({ onClose, onCreated }) {
  const [form, setForm] = useState({ name: '', email: '', phone: '', max_capacity: 10 });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const submit = async () => {
    if (!form.name || !form.email) { setError('Name and email are required.'); return; }
    setLoading(true); setError('');
    try {
      const agent = await apiFetch('/agents', { method: 'POST', body: JSON.stringify({ ...form, max_capacity: +form.max_capacity }) });
      onCreated(agent); onClose();
    } catch (e) { setError(e.message); }
    setLoading(false);
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h3>Add New Agent</h3>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-group"><label>Full name *</label><input value={form.name} onChange={e => set('name', e.target.value)} placeholder="Sarah Mitchell"/></div>
        <div className="form-group"><label>Email *</label><input value={form.email} onChange={e => set('email', e.target.value)} placeholder="sarah@insure.com"/></div>
        <div className="form-row">
          <div className="form-group"><label>Phone</label><input value={form.phone} onChange={e => set('phone', e.target.value)} placeholder="07700 111 001"/></div>
          <div className="form-group"><label>Max capacity</label><input type="number" value={form.max_capacity} onChange={e => set('max_capacity', e.target.value)} min="1" max="100"/></div>
        </div>
        <div className="form-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>{loading ? 'Adding...' : 'Add Agent'}</button>
        </div>
      </div>
    </div>
  );
}

// ── Leads Page ───────────────────────────────────────────────────────────
function LeadsPage() {
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showCreate, setShowCreate] = useState(false);
  const [message, setMessage] = useState('');
  const [filterStatus, setFilterStatus] = useState('ALL');

  const load = useCallback(async () => {
    setLoading(true);
    try { setLeads(await apiFetch('/leads')); } catch {}
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  const flash = (msg) => { setMessage(msg); setTimeout(() => setMessage(''), 3000); };

  const assign = async (id) => {
    try { const r = await apiFetch(`/leads/${id}/assign`, { method: 'POST' }); flash(r.message); load(); }
    catch (e) { flash('Error: ' + e.message); }
  };

  const advance = async (lead) => {
    const map = { NEW: 'CONTACTED', CONTACTED: 'QUALIFIED', QUALIFIED: 'CONVERTED' };
    const next = map[lead.status];
    if (!next) return;
    try { await apiFetch(`/leads/${lead.id}/status`, { method: 'PATCH', body: JSON.stringify({ new_status: next }) }); flash(`Status updated to ${next}`); load(); }
    catch (e) { flash('Error: ' + e.message); }
  };

  const statuses = ['ALL','NEW','CONTACTED','QUALIFIED','CONVERTED','LOST'];
  const filtered = filterStatus === 'ALL' ? leads : leads.filter(l => l.status === filterStatus);

  return (
    <div>
      {message && <div className="success-banner">{message}</div>}
      <div style={{ display: 'flex', gap: 8, marginBottom: 20, flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between' }}>
        <div className="flex-gap">
          {statuses.map(s => (
            <button key={s} className={`btn btn-sm ${filterStatus === s ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setFilterStatus(s)}>{s}</button>
          ))}
        </div>
        <button className="btn btn-primary" onClick={() => setShowCreate(true)}>+ New Lead</button>
      </div>
      {loading ? <div className="loading">Loading leads...</div> : (
        <div className="table-wrap">
          <div className="table-header"><h3>Leads ({filtered.length})</h3></div>
          {filtered.length === 0 ? <div className="empty">No leads found. Create your first lead!</div> : (
            <table>
              <thead><tr>
                <th>Name</th><th>Type</th><th>Status</th><th>Score</th><th>Source</th><th>Agent</th><th>Actions</th>
              </tr></thead>
              <tbody>
                {filtered.map(l => (
                  <tr key={l.id}>
                    <td>
                      <div style={{ fontWeight: 500 }}>{l.full_name}</div>
                      <div style={{ fontSize: 11, color: 'var(--muted)' }}>{l.email}</div>
                    </td>
                    <td><span className={`badge badge-${l.lead_type}`}>{l.lead_type}</span></td>
                    <td><span className={`badge badge-${l.status}`}>{l.status}</span></td>
                    <td><ScoreBar score={l.score}/></td>
                    <td><span className="tag">{l.lead_source}</span></td>
                    <td style={{ fontSize: 12, color: 'var(--muted)' }}>{l.agent_id ? l.agent_id.slice(0,8) + '…' : '—'}</td>
                    <td>
                      <div className="flex-gap">
                        {!l.agent_id && <button className="btn btn-sm btn-teal" onClick={() => assign(l.id)}>Assign</button>}
                        {['NEW','CONTACTED','QUALIFIED'].includes(l.status) && (
                          <button className="btn btn-sm btn-ghost" onClick={() => advance(l)}>Advance →</button>
                        )}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}
      {showCreate && <CreateLeadModal onClose={() => setShowCreate(false)} onCreated={() => { load(); flash('Lead created and scored!'); }}/>}
    </div>
  );
}

// ── Agents Page ──────────────────────────────────────────────────────────
function AgentsPage() {
  const [agents, setAgents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showCreate, setShowCreate] = useState(false);

  const load = useCallback(async () => {
    setLoading(true);
    try { setAgents(await apiFetch('/agents')); } catch {}
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 20 }}>
        <button className="btn btn-primary" onClick={() => setShowCreate(true)}>+ Add Agent</button>
      </div>
      {loading ? <div className="loading">Loading agents...</div> : (
        <div className="table-wrap">
          <div className="table-header"><h3>Agents ({agents.length})</h3></div>
          {agents.length === 0 ? <div className="empty">No agents yet. Add your first agent!</div> : (
            <table>
              <thead><tr><th>Name</th><th>Email</th><th>Load</th><th>Capacity</th><th>Utilisation</th><th>Status</th></tr></thead>
              <tbody>
                {agents.map(a => (
                  <tr key={a.id}>
                    <td style={{ fontWeight: 500 }}>{a.name}</td>
                    <td style={{ color: 'var(--muted)', fontSize: 13 }}>{a.email}</td>
                    <td>{a.current_load}</td>
                    <td>{a.max_capacity}</td>
                    <td>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <div style={{ background: 'var(--bg3)', borderRadius: 4, height: 6, width: 80, overflow: 'hidden' }}>
                          <div style={{ height: '100%', width: `${a.utilisation_pct}%`, background: a.utilisation_pct > 80 ? 'var(--coral)' : 'var(--teal)', borderRadius: 4 }}/>
                        </div>
                        <span style={{ fontSize: 12, color: 'var(--muted)' }}>{a.utilisation_pct}%</span>
                      </div>
                    </td>
                    <td>
                      <span className={`badge ${a.is_available ? 'badge-QUALIFIED' : 'badge-LOST'}`}>
                        {a.is_available ? 'Available' : 'Full'}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}
      {showCreate && <CreateAgentModal onClose={() => setShowCreate(false)} onCreated={() => load()}/>}
    </div>
  );
}

// ── Reports Page ─────────────────────────────────────────────────────────
function ReportsPage() {
  const [report, setReport] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(async () => {
    try { setReport(await apiFetch('/reports/summary')); } catch {}
    setLoading(false);
  }, []);

  if (loading) return <div className="loading">Loading report...</div>;
  if (!report)  return <div className="empty">Could not load report.</div>;

  const statusColors = { NEW: '#60a5fa', CONTACTED: '#7c6ff7', QUALIFIED: '#22d3aa', CONVERTED: '#4ade80', LOST: '#f97066' };
  const total = Object.values(report.leads_by_status).reduce((a, b) => a + b, 0);

  return (
    <div>
      <div className="cards" style={{ marginBottom: 28 }}>
        <div className="card"><div className="card-label">Total leads</div><div className="card-value" style={{ color: 'var(--purple)' }}>{total}</div></div>
        {Object.entries(report.leads_by_status).map(([s, c]) => (
          <div className="card" key={s}>
            <div className="card-label">{s}</div>
            <div className="card-value" style={{ color: statusColors[s] || 'var(--text)' }}>{c}</div>
            <div className="card-sub">{total ? ((c/total)*100).toFixed(0) : 0}% of total</div>
          </div>
        ))}
      </div>

      <div className="split" style={{ marginBottom: 24 }}>
        <div className="table-wrap">
          <div className="table-header"><h3>Agent Performance</h3></div>
          <table>
            <thead><tr><th>Agent</th><th>Total</th><th>Converted</th><th>Rate</th></tr></thead>
            <tbody>
              {report.agent_performance.length === 0
                ? <tr><td colSpan={4}><div className="empty" style={{ padding: 20 }}>No agents yet</div></td></tr>
                : report.agent_performance.map((a, i) => (
                    <tr key={i}>
                      <td style={{ fontWeight: 500 }}>{a.agent}</td>
                      <td>{a.total_leads}</td>
                      <td>{a.converted}</td>
                      <td style={{ color: a.conversion_rate > 50 ? 'var(--green)' : 'var(--muted)' }}>{a.conversion_rate}%</td>
                    </tr>
                  ))
              }
            </tbody>
          </table>
        </div>

        <div className="table-wrap">
          <div className="table-header"><h3>Top Scored Leads</h3></div>
          <table>
            <thead><tr><th>Name</th><th>Type</th><th>Score</th><th>Status</th></tr></thead>
            <tbody>
              {report.top_scored_leads.length === 0
                ? <tr><td colSpan={4}><div className="empty" style={{ padding: 20 }}>No leads yet</div></td></tr>
                : report.top_scored_leads.map((l, i) => (
                    <tr key={i}>
                      <td style={{ fontWeight: 500 }}>{l.name}</td>
                      <td><span className={`badge badge-${l.type}`}>{l.type}</span></td>
                      <td><ScoreBar score={l.score}/></td>
                      <td><span className={`badge badge-${l.status}`}>{l.status}</span></td>
                    </tr>
                  ))
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── App Shell ────────────────────────────────────────────────────────────
const PAGES = [
  { id: 'leads',   icon: '📋', label: 'Leads' },
  { id: 'agents',  icon: '👥', label: 'Agents' },
  { id: 'reports', icon: '📊', label: 'Reports' },
];

function App() {
  const [page, setPage] = useState('leads');
  const [apiOk, setApiOk] = useState(null);

  useEffect(() => {
    apiFetch('/health').then(() => setApiOk(true)).catch(() => setApiOk(false));
  }, []);

  const pageTitles = { leads: 'Lead Management', agents: 'Agent Roster', reports: 'Analytics & Reports' };

  return (
    <div className="app">
      <nav className="sidebar">
        <div className="logo">
          <h1>🛡 InsureLead</h1>
          <p>Management System</p>
        </div>
        {PAGES.map(p => (
          <div key={p.id} className={`nav-item ${page === p.id ? 'active' : ''}`} onClick={() => setPage(p.id)}>
            <span className="nav-icon">{p.icon}</span>{p.label}
          </div>
        ))}
        <div style={{ marginTop: 'auto', padding: '16px 20px', borderTop: '1px solid var(--border)' }}>
          <div style={{ fontSize: 11, color: 'var(--muted)', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ width: 7, height: 7, borderRadius: '50%', background: apiOk === null ? 'var(--amber)' : apiOk ? 'var(--green)' : 'var(--coral)', display: 'inline-block' }}/>
            API {apiOk === null ? 'checking…' : apiOk ? 'connected' : 'offline'}
          </div>
          <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 4 }}>FastAPI · SQLite · Python</div>
        </div>
      </nav>
      <div className="main">
        <div className="topbar">
          <h2>{pageTitles[page]}</h2>
          <a href="http://localhost:8000/docs" target="_blank" style={{ fontSize: 12, color: 'var(--purple)', textDecoration: 'none' }}>Swagger API docs ↗</a>
        </div>
        <div className="content">
          {apiOk === false && (
            <div className="error-banner">
              ⚠ Cannot reach API at {API}. Make sure the FastAPI server is running: <code>uvicorn api.app:app --reload</code>
            </div>
          )}
          {page === 'leads'   && <LeadsPage/>}
          {page === 'agents'  && <AgentsPage/>}
          {page === 'reports' && <ReportsPage/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
